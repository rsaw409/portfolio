<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Join a group on Split</title>
    <meta name="description" content="You've been invited to a group on Split, the app for splitting expenses." />
    <link rel="icon" href="/split-icon.png" />
    <!--
      Landing page for Split invite links (/joinGroup/<inviteId>), served via a
      Render rewrite so the address bar keeps the invite link. Deliberately
      standalone: the portfolio's React app rewrites the URL on load.

      People with Split installed normally never see this page, because Android
      App Links open the app directly. It is for everyone else: on Android it
      hands the link to the app if present, otherwise to the Play Store.
    -->
    <style>
      :root {
        --bg: #fef7ff;
        --surface: #ffffff;
        --text: #1d1b20;
        --muted: #49454f;
        --primary: #65558f;
        --on-primary: #ffffff;
        --outline: #cac4d0;
        --chip: #f3edf7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141218;
          --surface: #211f26;
          --text: #e6e0e9;
          --muted: #cac4d0;
          --primary: #cfbdfe;
          --on-primary: #36275d;
          --outline: #49454f;
          --chip: #2b2930;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--outline);
        border-radius: 28px;
        padding: 32px 24px;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 24px; font-weight: 500; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      .actions { display: grid; gap: 12px; }
      .button {
        display: block;
        padding: 14px 24px;
        border-radius: 100px;
        font-size: 16px;
        font-weight: 500;
        text-decoration: none;
      }
      .primary { background: var(--primary); color: var(--on-primary); }
      .secondary { border: 1px solid var(--outline); color: var(--primary); }
      .code {
        margin-top: 24px;
        padding: 12px 16px;
        border-radius: 12px;
        background: var(--chip);
        font-size: 13px;
        text-align: left;
      }
      .code span { color: var(--muted); }
      .code code { display: block; margin-top: 4px; word-break: break-all; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img src="/split-icon.png" alt="" />
      <h1>You're invited to a Split group</h1>
      <p id="message">
        Split keeps track of shared expenses and who owes whom.
      </p>
      <div class="actions">
        <a id="open" class="button primary" hidden>Open in Split</a>
        <a id="install" class="button secondary">Get it on Google Play</a>
      </div>
      <div id="code" class="code" hidden>
        <span>Or enter this invite code in Split under Join group:</span>
        <code id="invite-id"></code>
      </div>
    </main>

    <script>
      (function () {
        var PACKAGE = "developer.rohitsaw.split";
        // Must match the app's intent filter, whatever host serves this page.
        var LINK_HOST = "portfolio.rsaw409.me";
        var PLAY_URL = "https://play.google.com/store/apps/details?id=" + PACKAGE;
        var PREFIX = "/joinGroup/";

        // Everything after the prefix is the id, exactly as the app parses
        // it: ids are base64-like and can contain "/" (sent as %2F or raw).
        var path = location.pathname;
        var raw = path.indexOf(PREFIX) === 0 ? path.slice(PREFIX.length) : "";
        var inviteId;
        try {
          inviteId = decodeURIComponent(raw);
        } catch (e) {
          inviteId = raw;
        }

        var isAndroid = /Android/i.test(navigator.userAgent);
        var install = document.getElementById("install");
        install.href = PLAY_URL;

        if (inviteId) {
          document.getElementById("invite-id").textContent = inviteId;
          document.getElementById("code").hidden = false;
        }

        if (!isAndroid) {
          document.getElementById("message").textContent =
            "Split is available for Android. Open this link on your Android " +
            "phone, or scan the invite QR code with its camera.";
          return;
        }

        if (!inviteId) return;

        // Chrome, Samsung Internet, Edge and Brave open the app if it is
        // installed, and go to the Play Store (the fallback URL) if not.
        var intentUrl =
          "intent://" + LINK_HOST + PREFIX + encodeURIComponent(inviteId) +
          "#Intent;scheme=https;package=" + PACKAGE +
          ";S.browser_fallback_url=" + encodeURIComponent(PLAY_URL) + ";end";

        var open = document.getElementById("open");
        open.href = intentUrl;
        open.hidden = false;
        document.getElementById("message").textContent =
          "Opening Split… If nothing happens, use the buttons below. " +
          "After installing, open this invite link again to join.";

        // Browsers that ignore intent:// (or block it without a tap) leave
        // this page visible; send those to the Play Store. If the app or the
        // Play Store did open, the page is hidden and the timer is cancelled.
        var fallback = setTimeout(function () {
          if (document.visibilityState === "visible") location.href = PLAY_URL;
        }, 2000);
        function cancel() { clearTimeout(fallback); }
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") cancel();
        });
        window.addEventListener("pagehide", cancel);
        window.addEventListener("blur", cancel);

        location.href = intentUrl;
      })();
    </script>
  </body>
</html>
